name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract Flutter source
        run: |
          unzip -q developer-omor-ai-android-build.zip
          test -f developer_omor_ai/pubspec.yaml
      - name: Install dependencies
        working-directory: developer_omor_ai
        run: flutter pub get
      - name: Build installable APK
        working-directory: developer_omor_ai
        run: |
          flutter create --platforms=android --org com.omor.developer_omor_ai .
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: developer-omor-ai-release-apk
          path: developer_omor_ai/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
