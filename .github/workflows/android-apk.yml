            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdk = 34/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
            sed -i 's/compileSdk = 34/compileSdk = 36/' android/app/build.gradle
          fi
          echo "Android compile SDK configuration:"
          grep -n "compileSdk" android/app/build.gradle* || true
          flutter pub get
          # Some Flutter plugins pin compileSdk to 34/35. Patch the actual pub cache
          # (PUB_CACHE is not guaranteed to be under ~/.pub-cache on GitHub runners).
          python3 - <<'PY'
          import os, re
          roots = {
              os.environ.get("PUB_CACHE", ""),
              os.path.expanduser("~/.pub-cache"),
              os.path.join(os.environ.get("APP_DIR", "."), ".dart_tool"),
              os.environ.get("RUNNER_TEMP", ""),
          }
          pattern = re.compile(r"(compileSdk(?:Version)?\s*(?:=\s*)?)(34|35)\b")
          changed = []
          for root in sorted(r for r in roots if r and os.path.isdir(r)):
              for current, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle"}]
                  for name in files:
                      if name not in ("build.gradle", "build.gradle.kts"):
                          continue
                      path = os.path.join(current, name)
                      try:
                          with open(path, encoding="utf-8") as f:
                              source = f.read()
                          updated, count = pattern.subn(r"\g<1>36", source)
                          if count:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(updated)
                              changed.append((path, count))
                      except (OSError, UnicodeError):
                          pass
          for path, count in changed:
              print(f"Updated compileSdk in {path} ({count} occurrence(s))")
          if not changed:
              print("No pinned compileSdk 34/35 Gradle declarations found in searched roots.")
          PY
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: developer-omor-ai-v3-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
