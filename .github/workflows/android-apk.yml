name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract V3 source and locate Flutter app
        run: |
          mkdir -p source_v3
          unzip -q developer-omor-ai-source-v3.zip -d source_v3
          PUBSPEC="$(find source_v3 -type f -name pubspec.yaml -print -quit)"
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: V3 archive does not contain a Flutter pubspec.yaml"
            echo "Archive file list:"
            find source_v3 -maxdepth 4 -type f | head -200
            exit 1
          fi
          APP_DIR="${PUBSPEC%/pubspec.yaml}"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Building Flutter project at: $APP_DIR"
      - name: Install dependencies
        run: cd "$APP_DIR" && flutter pub get
      - name: Prepare Android SDK and build installable APK
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.omor.developer_omor_ai .
          fi
          python3 "$GITHUB_WORKSPACE/scripts/enable_notifications.py" "$APP_DIR"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdk = 34/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
            sed -i 's/compileSdk = 34/compileSdk = 36/' android/app/build.gradle
          fi
          echo "Android compile SDK configuration:"
          grep -n "compileSdk" android/app/build.gradle* || true
          flutter pub get
          # Some Flutter plugins pin compileSdk to 34/35. Patch the actual pub cache
          # (PUB_CACHE is not guaranteed to be under ~/.pub-cache on GitHub runners).
          python3 - <<'PY'
          import os, re
          roots = {
              os.environ.get("PUB_CACHE", ""),
              os.path.expanduser("~/.pub-cache"),
              os.path.join(os.environ.get("APP_DIR", "."), ".dart_tool"),
              os.environ.get("RUNNER_TEMP", ""),
          }
          pattern = re.compile(r"(compileSdk(?:Version)?\s*(?:=\s*)?)(34|35)\b")
          changed = []
          for root in sorted(r for r in roots if r and os.path.isdir(r)):
              for current, dirs, files in os.walk(root):
                  dirs[:] = [d for d in dirs if d not in {".git", "build", ".gradle"}]
                  for name in files:
                      if name not in ("build.gradle", "build.gradle.kts"):
                          continue
                      path = os.path.join(current, name)
                      try:
                          with open(path, encoding="utf-8") as f:
                              source = f.read()
                          updated, count = pattern.subn(r"\g<1>36", source)
                          if count:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(updated)
                              changed.append((path, count))
                      except (OSError, UnicodeError):
                          pass
          for path, count in changed:
              print(f"Updated compileSdk in {path} ({count} occurrence(s))")
          if not changed:
              print("No pinned compileSdk 34/35 Gradle declarations found in searched roots.")
          PY
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: developer-omor-ai-v3-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
, r'\\1 {\\n' + method + '\\n}', source)
                  if "override fun onCreate" not in source:
                      raise SystemExit("Could not inject Kotlin notification permission request")
                  activity.write_text(source)
              print(f"Notification permission request configured in {activity}")
          elif java_files:
              activity = java_files[0]
              source = activity.read_text()
              if "POST_NOTIFICATIONS" not in source:
                  imports = [
                      "import android.Manifest;",
                      "import android.content.pm.PackageManager;",
                      "import android.os.Build;",
                      "import android.os.Bundle;",
                  ]
                  package_line = re.search(r'^package\\s+[^\\n]+;', source, re.M)
                  insertion = package_line.end() if package_line else 0
                  source = source[:insertion] + "\\n" + "\\n".join(i for i in imports if i not in source) + source[insertion:]
                  method = '''
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1001);
                  }
              }
          '''
                  pos = source.rfind("}")
                  source = source[:pos] + method + "\\n" + source[pos:]
                  activity.write_text(source)
              print(f"Notification permission request configured in {activity}")
          else:
              raise SystemExit("MainActivity.kt/java not found; cannot request notification permission")
          PY
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
